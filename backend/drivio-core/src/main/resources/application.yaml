spring:
  application:
    name: drivio-core

  datasource:
    url: jdbc:postgresql://localhost:5433/drivio
    username: drivio
    password: drivio
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
